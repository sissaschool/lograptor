#
# lograptor configuration file. See lograptor.conf(5) for more info.
#
[main]
confdir = ./conf.d/
logdir = /var/log/
tmpdir = /var/tmp/
logfile = /var/log/lograptor.log
smtp_server = /usr/sbin/sendmail -t
from_address = root@localhost.localdomain
encodings = utf_8, latin1, latin2
mapexp = 4


#
# Additional named regex patterns, used for app rules and filter interpolation.
# Starting from v2.0 these patterns are in GROK format and are used also for
# expanding app rules, that are also now using the GROK syntax (the old format
# is supported for legacy).
#
# There are a set or several predefined patterns that you could override.
# Otherwise you can define additional pattern to use in your custom rules.
# For convention uppercase names are used for patterns, in order to avoid
# ambiguities with other settings.
# These are the predefined patterns:
#
#   DNSNAME: Regexp pattern that match DNS names
#   IPV4_ADDRESS: Regexp pattern that match IPv4 addresses
#   IPV6_ADDRESS: Regexp pattern that match IPv6 addresses
#   USERNAME: Regexp pattern that match usernames
#   EMAIL: Regexp pattern that match e-mail addresses
#   ASCII: Regexp pattern that match ASCII characters
#   ID: Regexp pattern that match numerical ID
#
[patterns]

#
# Additional named regex patterns from files. These files are loaded in order
# after the patterns specified in configuration file. Can be used to add your
# custom patterns or to override. Each uncommented and not empty line in file
# is loaded, checked and translated to raw format.
[pattern_files]
patterns = ./patterns

#
# Additional extraction fields
#
# Fields are used for final data extraction and are defined usually in terms of regexp patterns.
# These are the predefined fields:
#
#   user = (|${USERNAME})
#   mail
#   from
#   rcpt
#   client
#   pid
#   uid
#   msgid
#
[fields]

#
# Additional log formats
#
# Options added in this section are used to derive custom parsers. Option value can be
# regex or a GROK-like pattern, that is expanded using predefined patterns.
#
[parsers]
alt_rfc_5424 = ^(?:<(?P<pri>[0-9]{1,3})>(?P<ver>[0-9]{0,2}) |)
                (?:-|(?P<year>[0-9]{4})-(?P<month>[0-9]{2})-
                (?P<day>[0-9]{2})T)(?P<ltime>[0-9]{2}:[0-9]{2}:[0-9]{2})
                (?:|\.(?P<secfrac>[0-9]{1,6}))
                (?:Z |(?P<offset>(?:\+|-)[0-9]{2}:[0-9]{2}) )
                (?:-|(?P<host>\S{1,255})) (?:-|(?P<apptag>\S{1,48}))
                (?:-|(?P<procid>\S{1,128})) (?:-|(?P<msgid>\S{1,32}))
                (?P<message>.*)

#
# Output channels settings
#
[stdout_channel]
type = tty
formats = text

[mail_channel]
type = mail
formats = text, html
mailto = root@localhost.localdomain
include_rawlogs = no
rawlogs_limit = 200

[file_channel]
type = file
formats = html, csv
pubdir = /var/tmp/www/
dirmask = %Y-%b-%d_%a
filemask = %H%M
save_rawlogs = yes
expire_in = 7
notify = root@localhost.localdomain
pubroot = https://localhost/lograptor


#
# Reports settings
#
# Copy and modify the default configuration that follows to
# your custom section [report.your_section_name].
#
[default_report]
title = ${localhost} system events: ${localtime}
html_template = ./report_template.html
text_template = ./report_template.txt
login_subreport = Logins
mail_subreport = Mail report
command_subreport = System commands
query_subreport = Database lookups
