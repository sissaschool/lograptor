# "postfix" app configuration for lograptor

[main]
description = Postfix Mail Service
tags = postfix, postfix/anvil, postfix/bounce, postfix/cleanup, postfix/smtp, postfix/qmgr,
       postfix/pickup, postfix/local, postfix/smtp, postfix/smtpd
files = ${logdir}/maillog*, ${logdir}/postfix*, ${logdir}/${host}/%Y/%m/maillog-%Y%m%d.log*
enabled = yes
priority = 10 

[rules]
Connect_From = : connect from %{CLIENT}
Mail_Received = : (?P<thread>[A-Z,0-9]{9,14}): from=<(?P<from>${from})>, size=(?P<size>\d+), nrcpt=(?P<mult>\d+)
Mail_Sent = : (?P<thread>[A-Z,0-9]{9,14}): to=<(?P<rcpt>${rcpt})>,(\s(\S+),){4,5}\sstatus=sent
Mail_Client = : (?P<thread>[A-Z,0-9]{9,14}): client=%{CLIENT}
Mail_Pickup = : (?P<thread>[A-Z,0-9]{9,14}):\suid=\d+\sfrom=<(?P<from>${from})>
Mail_Removed = : (?P<thread>[A-Z,0-9]{9,14}): removed
Mail_Resent = : (?P<thread>[A-Z,0-9]{9,14}): resent-message-id=<(?P<reason>.+)>
Mail_Cleanup = : (?P<thread>[A-Z,0-9]{9,14}): message-id=
Client_Disconnect = : disconnect from %{CLIENT}$
Connect_To_Refused = : connect to %{CLIENT}:\d+: Connection refused
Connect_To_Timeout = : connect to %{CLIENT}:\d+: Connection timed out
Lost_Connection = : lost connection after (?P<reason>.+) from %{CLIENT}
Timeout = : timeout after (?P<reason>.+) from %{CLIENT}
TLS_Setup = : setting up TLS connection from %{CLIENT}
TLS_Connection = : TLS connection established from %{CLIENT}
SMTPD_Warning = : warning: (?P<reason>.+)
SMTPD_Table_Change = : table hash:(?P<table>.+) has changed -- restarting
Mail_Deferred = : (?P<thread>[A-Z,0-9]{9,14}): to=<(?P<rcpt>${rcpt})>,(\s(\S+),){4,5}\sstatus=deferred
Remote_Deferred = smtp\[%{PID}\]: (?P<thread>[A-Z,0-9]{9,14}): host %{CLIENT} said:\s
                  420 deferred due to suspect content, please try again later \(in reply to end of DATA command\)
Mail_Bounce = \[%{PID}\]: (?P<thread>[A-Z,0-9]{9,14}): to=<(?P<rcpt>${rcpt})>,
              ( orig_to=<(?P<rcpt2>${rcpt})>,)?\s
              relay=((?P<client1>${client}):25|(?P<service>.+)),(\s(\S+),){2,4}\sstatus=bounced\s
              \((host (?P<client2>${client}) said: (?P<reason>.+)|user unknown)\)
Mail_Reject = : (?P<thread>(NOQUEUE|[A-Z,0-9]{9,14})): reject: RCPT from %{CLIENT}: (?P<reason>.+)
SSL_Error = : SSL_accept error from %{CLIENT}
Rate_Limit = : (?P<thread>[A-Z,0-9]{9,14}): host %{CLIENT} said:
              450 too many mails from this sender \(rate controlled\)
Max_Connections = \[%{PID}\]: statistics: max connection (?P<reason>.+) for \(\w+:
                   %{CLIENT}\) at (?P<datetime>.+)
Max_Cache_Size = \[%{PID}\]: statistics: max cache size \d+ at (?P<datetime>.+)
Bounce_Notification = \[%{PID}\]: (?P<thread>[A-Z,0-9]{9,14}): sender (
                       non-delivery|delivery status) notification: (?P<queue_id>[A-Z,0-9]{9,14})
Temporary_Failure = \[%{PID}\]: (?P<thread>[A-Z,0-9]{9,14}): host %{CLIENT} said:\s
                    421 Temporary failure, please try again later\.
Milter_Reject = \[%{PID}\]: ((?P<thread>[A-Z,0-9]{9,14})|NOQUEUE): milter-reject: (END-OF-MESSAGE|RCPT)\s
                from %{CLIENT}: (?P<message>.+)
Policy_SPF = policy-spf\[%{PID}\]: (?P<message>.+)
Scache_Message = scache\[%{PID}\]: statistics: (?P<message>.+)
Queue_Expired = qmgr\[%{PID}\]: (?P<thread>[A-Z,0-9]{9,14}): from=<(?P<from>${from})>,\s
                status=expired, returned to sender
Master_Message = master\[%{PID}\]: (?P<message>.+)
Postfix_Script = postfix-script\[%{PID}\]: (?P<message>.+)
SMTP_PIX = smtp\[%{PID}\]: (?P<thread>[A-Z,0-9]{9,14}): enabling PIX workarounds: (?P<message>.+)


##
# Report data items
#
[totals]
subreport = mail
title = General Mail Report
color = blue
function = total
Mail_Received = (*, "Total Messages Processed")
Mail_Sent = (*,"Total Successful Deliveries")
Mail_Deferred = (*,"Total Deferred Messages")
Mail_Bounce = (*,"Total Bounced Messages")
Mail_Received2 = (*,"Total Transferred Size":size[B]) 

[top5_systems]
subreport = mail
title = Top 5 active systems
color = blue
function = top(5,"Hostname")
Mail_Received = (*,host)

[top5_clients]
subreport = mail
title = Top 5 connecting hosts
color = blue
function = top(5,"Client host")
Mail_Client = (*,client)

[top10_senders]
subreport = mail
title = Top 10 senders
color = blue
function = top(10,"Sender")
Mail_Received = (*,from)

[top10_recipients]
subreport = mail
title = Top 10 recipients
color = blue
function = top(10,"Recipient")
Mail_Sent = (*,rcpt)

[top10_size]
subreport = mail
title = Top 10 message size
color = blue
function = top(10,"Sender")
Mail_Received = (*,from:size[B])

[top10_total_size]
subreport = mail
title = Top 10 total size
color = blue
function = top(10,"Sender")
Mail_Received = (*,from:+size[B])

