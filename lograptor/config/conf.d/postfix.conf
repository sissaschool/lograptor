# "postfix" app configuration for lograptor

[main]
description = Postfix Mail Service
tags = postfix, postfix/anvil, postfix/bounce, postfix/cleanup, postfix/smtp, postfix/qmgr,
       postfix/pickup, postfix/local, postfix/smtp, postfix/smtpd
files = ${logdir}/maillog*, ${logdir}/postfix*, ${logdir}/${host}/%Y/%m/maillog-%Y%m%d.log*
enabled = yes
priority = 10 

[rules]
CONNECT_FROM = : connect from %{IPORHOST:client}
MAIL_RECEIVED = : %{ALNUM:thread}: from=<%{EMAIL:from}>, size=%{POSINT:size}, nrcpt=%{POSINT:mult}
MAIL_SENT = : %{ALNUM:thread}: to=<%{EMAIL:rcpt}>,(\s(\S+),){4,5}\sstatus=sent
MAIL_CLIENT = : %{ALNUM:thread}: client=%{IPORHOST:client}
MAIL_PICKUP = : %{ALNUM:thread}:\suid=\d+\sfrom=<%{EMAIL:from}>
MAIL_REMOVED = : %{ALNUM:thread}: removed
MAIL_RESENT = : %{ALNUM:thread}: resent-message-id=<%{GREEDYDATA:reason}>
MAIL_CLEANUP = : %{ALNUM:thread}: message-id=
CLIENT_DISCONNECT = : disconnect from %{IPORHOST:client}
CONNECT_TO_REFUSED = : connect to %{IPORHOST:client}:\d+: Connection refused
CONNECT_TO_TIMEOUT = : connect to %{IPORHOST:client}:\d+: Connection timed out
LOST_CONNECTION = : lost connection after %{GREEDYDATA:reason} from %{IPORHOST:client}
TIMEOUT = : timeout after %{GREEDYDATA:reason} from %{IPORHOST:client}
TLS_SETUP = : setting up TLS connection from %{IPORHOST:client}
TLS_CONNECTION = : TLS connection established from %{IPORHOST:client}
SMTPD_WARNING = : warning: %{GREEDYDATA:reason}
SMTPD_TABLE_CHANGE = : table hash:%{GREEDYDATA:table} has changed -- restarting
MAIL_DEFERRED = : %{ALNUM:thread}: to=<%{EMAIL:rcpt}>,(\s(\S+),){4,5}\sstatus=deferred
REMOTE_DEFERRED = smtp\[%{POSINT:pid}\]: %{ALNUM:thread}: host %{IPORHOST:client} said:\s
                  420 deferred due to suspect content, please try again later \(in reply to end of DATA command\)
MAIL_BOUNCE = \[%{POSINT:pid}\]: %{ALNUM:thread}: to=<%{EMAIL:rcpt}>,
              ( orig_to=<%{EMAIL:rcpt2}>,)?\s
              relay=(%{IPORHOST:client1}:25|%{GREEDYDATA:service}),(\s(\S+),){2,4}\sstatus=bounced\s
              \((host %{IPORHOST:client2} said: %{GREEDYDATA:reason}|user unknown)\)
MAIL_REJECT = : %{ALNUM:thread}: reject: RCPT from %{IPORHOST:client}: %{GREEDYDATA:reason}
SSL_ERROR = : SSL_accept error from %{IPORHOST:client}
RATE_LIMIT = : %{ALNUM:thread}: host %{IPORHOST:client} said:
              450 too many mails from this sender \(rate controlled\)
MAX_CONNECTIONS = \[%{POSINT:pid}\]: statistics: max connection %{GREEDYDATA:reason} for \(\w+:
                   %{IPORHOST:client}\) at %{GREEDYDATA:datetime}
MAX_CACHE_SIZE = \[%{POSINT:pid}\]: statistics: max cache size \d+ at %{GREEDYDATA:datetime}
BOUNCE_NOTIFICATION = \[%{POSINT:pid}\]: %{ALNUM:thread}: sender (
                       non-delivery|delivery status) notification: %{ALNUM:queue_id}
TEMPORARY_FAILURE = \[%{POSINT:pid}\]: %{ALNUM:thread}: host %{IPORHOST:client} said:\s
                    421 Temporary failure, please try again later\.
MILTER_REJECT = \[%{POSINT:pid}\]: (%{ALNUM:thread}|NOQUEUE): milter-reject: (END-OF-MESSAGE|RCPT)\s
                from %{IPORHOST:client}: %{GREEDYDATA:message}
POLICY_SPF = policy-spf\[%{POSINT:pid}\]: %{GREEDYDATA:message}
SCACHE_MESSAGE = scache\[%{POSINT:pid}\]: statistics: %{GREEDYDATA:message}
QUEUE_EXPIRED = qmgr\[%{POSINT:pid}\]: %{ALNUM:thread}: from=<%{EMAIL:from}>,\s
                status=expired, returned to sender
MASTER_MESSAGE = master\[%{POSINT:pid}\]: %{GREEDYDATA:message}
POSTFIX_SCRIPT = postfix-script\[%{POSINT:pid}\]: %{GREEDYDATA:message}
SMTP_PIX = smtp\[%{POSINT:pid}\]: %{ALNUM:thread}: enabling PIX workarounds: %{GREEDYDATA:message}


##
# Report data items
#
[totals]
subreport = mail
title = General Mail Report
color = blue
function = total
MAIL_RECEIVED = (*, "Total Messages Processed")
MAIL_SENT = (*,"Total Successful Deliveries")
MAIL_DEFERRED = (*,"Total Deferred Messages")
MAIL_BOUNCE = (*,"Total Bounced Messages")
MAIL_RECEIVED2 = (*,"Total Transferred Size":size[B])

[top5_systems]
subreport = mail
title = Top 5 active systems
color = blue
function = top(5,"Hostname")
MAIL_RECEIVED = (*,host)

[top5_clients]
subreport = mail
title = Top 5 connecting hosts
color = blue
function = top(5,"Client host")
MAIL_CLIENT = (*,client)

[top10_senders]
subreport = mail
title = Top 10 senders
color = blue
function = top(10,"Sender")
MAIL_RECEIVED = (*,from)

[top10_recipients]
subreport = mail
title = Top 10 recipients
color = blue
function = top(10,"Recipient")
MAIL_SENT = (*,rcpt)

[top10_size]
subreport = mail
title = Top 10 message size
color = blue
function = top(10,"Sender")
MAIL_RECEIVED = (*,from:size[B])

[top10_total_size]
subreport = mail
title = Top 10 total size
color = blue
function = top(10,"Sender")
MAIL_RECEIVED = (*,from:+size[B])

