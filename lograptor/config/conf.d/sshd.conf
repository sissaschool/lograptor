# "sshd" app configuration for lograptor

[main]
description = SSH daemon
tags = sshd
files = ${logdir}/secure*, ${logdir}/sshd*, ${logdir}/${host}/%Y/%m/secure-%Y%m%d.log*
enabled = yes
priority = 0

[rules]
USER_LOGINS_PK = \[%{POSINT:thread}\]: Accepted publickey for %{USER} from %{IPORHOST}
USER_LOGINS_PW = \[%{POSINT:thread}\]: Accepted password for %{USER} from %{IPORHOST}
USER_FAILURES_PK = \[%{POSINT:thread}\]: Failed publickey for %{USER} from %{IPORHOST}
USER_FAILURES_PW = \[%{POSINT:thread}\]: Failed password for %{USER} from %{IPORHOST}
INVALID_USER_FAIL = \[%{POSINT:thread}\]: Failed password for invalid user %{USER}\s
                    from %{IPORHOST}
CONNECTION_OPEN = \[%{POSINT:thread}\]: Connection from %{IPORHOST} port (?P<port>\d+)
CONNECTION_CLOSING = \[%{POSINT:thread}\]: Closing connection to %{IPORHOST}
CONNECTION_CLOSED = \[%{POSINT:thread}\]: Connection closed by %{IPORHOST}
SESSION_OPEN = \[%{POSINT:thread}\]: pam_unix\(.+\): session opened for user %{USER}\s
               by \(uid\=(?P<uid>${uid})\)
SESSION_CLOSE = \[%{POSINT:thread}\]: pam_unix\(.+\): session closed for user %{USER}
MATCHING_KEY = \[%{POSINT:thread}\]: Found matching (?P<algorithm>[\w\d-]+) key:\s
               (?P<key>(?:[0-9a-f]{2}:)+[0-9a-f]{2})
POSTPONED_KEY = \[%{POSINT:thread}\]: Postponed publickey for %{USER} from\s
                %{IPORHOST} port (?P<port>\d+) ssh2
CLIENT_DISCONNECT = \[%{POSINT:thread}\]: Received disconnect from %{IPORHOST}: %{DATA:reason}
CONNECTION_TIMED_OUT = \[%{POSINT:thread}\]: Read error from remote host %{IPORHOST}


USER_LOGINS_PK = \[%{POSINT:thread}\]: Accepted publickey for %{USERNAME:user} from %{IPORHOST:client}
USER_LOGINS_PW = \[%{POSINT:thread}\]: Accepted password for %{USERNAME:user} from %{IPORHOST:client}
USER_FAILURES_PK = \[%{POSINT:thread}\]: Failed publickey for %{USERNAME:user} from %{IPORHOST:client}
USER_FAILURES_PW = \[%{POSINT:thread}\]: Failed password for %{USERNAME:user} from %{IPORHOST:client}
INVALID_USER_FAIL = \[%{POSINT:thread}\]: Failed password for invalid user %{USERNAME:user}\s
                    from %{IPORHOST:client}
CONNECTION_OPEN = \[%{POSINT:thread}\]: Connection from %{IPORHOST:client} port %{POSINT:port}
CONNECTION_CLOSING = \[%{POSINT:thread}\]: Closing connection to %{IPORHOST:client}
CONNECTION_CLOSED = \[%{POSINT:thread}\]: Connection closed by %{IPORHOST:client}
SESSION_OPEN = \[%{POSINT:thread}\]: pam_unix\(.+\): session opened for user %{USERNAME:user}\s
               by \(uid\=%{UID:uid}\)
SESSION_CLOSE = \[%{POSINT:thread}\]: pam_unix\(.+\): session closed for user %{USERNAME:user}
MATCHING_KEY = \[%{POSINT:thread}\]: Found matching %{NCNAME:algorithm} key:\s
               %{UNKNOWN:key}
POSTPONED_KEY = \[%{POSINT:thread}\]: Postponed publickey for %{USERNAME:user} from\s
                %{IPORHOST:client} port %{POSINT:port} ssh2
CLIENT_DISCONNECT = \[%{POSINT:thread}\]: Received disconnect from %{IPORHOST:client}: %{GREEDYDATA:reason}
CONNECTION_TIMED_OUT = \[%{POSINT:thread}\]: Read error from remote host %{IPORHOST:client}
                       : Connection timed out
AUTH_FAILURES = \[%{POSINT:thread}\]: (pam_unix\(.+\):|PAM \d+ more) authentication failure(s)?;\s
                (.+) rhost=%{IPORHOST:client}(\s+)user=%{USERNAME:user}
SET_VALUE = \[%{POSINT:thread}\]: Set %{GREEDYDATA:object} to %{POSINT:value}
TRANSFERRED = \[%{POSINT:thread}\]: Transferred: sent %{UNKNOWN:sent}, received %{POSINT:received}
USER_PID = \[%{POSINT:thread}\]: User child is on pid %{PID}
SFTP_REQUEST = \[%{POSINT:thread}\]: subsystem request for sftp
DISCONNECTING = \[%{POSINT:thread}\]: Disconnecting: %{GREEDYDATA:reason}
REVERSE_FAIL = \[%{POSINT:thread}\]: reverse mapping checking getaddrinfo for %{IPORHOST:client} failed
LDAP_RECONNECT = \[%{POSINT:thread}\]: nss_ldap: reconnected to LDAP server
PAM_LDAP_ERROR = \[%{POSINT:thread}\]: pam_ldap: error trying to bind as user "%{GREEDYDATA:user}"
INVALID_USER = \[%{POSINT:thread}\]: Invalid user %{USERNAME:user} from %{IPORHOST:client}
AUTH_INVALID_USER = \[%{POSINT:thread}\]: input_userauth_request: invalid user %{USERNAME:user}
PAM_ERROR = \[%{POSINT:thread}\]: pam_succeed_if\(.+\): error retrieving information\s
            about user %{USERNAME:user}
MISSING_ID_STRING = \[%{POSINT:thread}\]: Did not receive identification string from %{IPORHOST:client}
UNKNOWN_HOST = \[%{POSINT:thread}\]: error: connect_to %{USERNAME:user}@%{IPORHOST:client}: unknown host

##
# Report data items
#
[root_failures]
subreport = login
title = ROOT FAILURES
color = red
function = table("Hostname","Service","Client")
USER_FAILURES_PK = (user=="\broot\b",host,"sshd(pk)",client)
USER_FAILURES_PW = (user=="\broot\b",host,"sshd(pw)",client)

[root_logins]
subreport = login
title = ROOT Logins
color = blue
function = table("Hostname","Service","Client")
USER_LOGINS_PK = (user=="\broot\b",host,"sshd(pk)",client)
USER_LOGINS_PW = (user=="\broot\b",host,"sshd(pw)",client)

[user_failures]
subreport = login
title = User Failures
color = red
function = table("Username","Service","Server::client")
USER_FAILURES_PK = (user!="\broot\b",user,"sshd(pk)",host,client)
USER_FAILURES_PW = (user!="\broot\b",user,"sshd(pw)",host,client)

[user_logins]
subreport = login
title = User Logins
color = blue
function = table("Username","Service","Server::client")
USER_LOGINS_PK = (user!="\broot\b",user,"sshd(pk)",host,client)
USER_LOGINS_PW = (user!="\broot\b",user,"sshd(pw)",host,client)
