##
# "dovecot" app configuration for lograptor
#
[main]
description = Dovecot IMAP/POP daemon
tags = dovecot, deliver
files = ${logdir}/maillog*, ${logdir}/dovecot*, ${logdir}/${host}/%Y/%m/dovecot-%Y%m%d.log*
enabled = yes
priority = 2

##
# Matching rules for "dovecot" application
#
[rules]
IMAP_Login = dovecot: imap-login: Login: user=<%{USER}>,\sPID=(?P<thread>%{PID}),\s(\S+),\srip=%{CLIENT}
POP3_Login = dovecot: pop3-login: Login: user=<%{USER}>,\sPID=(?P<thread>%{PID}),\s(\S+),\srip=%{CLIENT}
# Not present in test logs
IMAP_Auth_Fail = dovecot: imap-login: Disconnected \(auth failed, \d+ attempts\): user=<(?P<user>${mail})>
                 , PID=%{PID}, method=PLAIN, rip=(?P<rip>${client}), lip=(?P<lip>${client})
# Not present in test logs
POP3_Auth_Fail = dovecot: pop3-login: Disconnected \(auth failed, \d+ attempts\): user=<(?P<user>${mail})>
                 , PID=%{PID}, method=PLAIN, rip=(?P<rip>${client}), lip=(?P<lip>${client})
# Not present in test logs
Deliver_Forward = deliver\(%{USER}\): msgid=(?P<msgid>${msgid}): forwarded to <(?P<mail>${mail})(?:|\.\.\.)>
IMAP_Login_Fail = dovecot: imap-login: (Disconnected|Aborted login)\s
                  \((?P<reason>.+)\):( user=<%{USER}>,)? PID=(?P<thread>%{PID})
                  (, method=(?P<method>.+))?, rip=%{CLIENT}, lip=(?P<lip>${client})
POP3_Login_Fail = dovecot: pop3-login: (Disconnected(|: Inactivity)|Aborted login)\s
                  \((?P<reason>.+)\):( user=<%{USER}>,)? PID=(?P<thread>%{PID})
                  (, method=(?P<method>.+))?, rip=%{CLIENT}, lip=(?P<lip>${client})
IMAP_Max_Conn = dovecot: imap-login: Maximum number of connections from user\+IP exceeded \(
                mail_max_userip_connections\): user=<%{USER}>, PID=%{PID}
                , method=PLAIN, rip=(?P<rip>${client}), lip=(?P<lip>${client}), TLS
IMAP_Disconnect = dovecot: (IMAP|imap)\(%{USER}\): Disconnected(?P<reason>.+)
IMAP_Disconnect2 = dovecot: imap-login: Disconnected(?P<reason>.+)
# Not present in test logs
IMAP_Error = dovecot: imap\(%{USER}\): Error: (?P<reason>.+)
POP3_Disconnect = dovecot: (POP3|pop3)\(%{USER}\): Disconnected(?P<reason>.+)
IMAP_Close = dovecot: (IMAP|imap)\(%{USER}\): Connection closed
POP3_Close = dovecot: (POP3|pop3)\(%{USER}\): Connection closed
Deliver_Save = deliver\(%{USER}\): msgid=(?P<msgid>${msgid}): saved mail to (?P<folder>.+)
Deliver_Forward2 = deliver\(%{USER}\): msgid=(?P<msgid>${msgid}): forwarded to <(?P<mail>${mail})>
Deliver_Save_Fail = deliver\(%{USER}\): msgid=(?P<msgid>${msgid}): save failed to (?P<folder>.+)
Deliver_Mkdir_Fail = deliver\(%{USER}\): mkdir\((?P<folder>.+)\) failed: Permission denied
Deliver_Sieve_Error = deliver\(%{USER}\): sieve runtime error: (?P<reason>.+)
Deliver_Sieve_Fail = deliver\(%{USER}\): sieve_execute_bytecode\(.+\) failed
Deliver_Discard = deliver\(%{USER}\): msgid=(?P<msgid>${msgid}): discarded(?P<reason>.*)
Deliver_Vacation = deliver\(%{USER}\): msgid=(?P<msgid>${msgid}): sent vacation response to <(?P<mail>${mail})(?:|\.\.\.)>
Sieve_Login = dovecot: managesieve-login: Login: user=<(?P<user>${mail})>, PID=%{PID}, method=PLAIN
               , rip=(?P<rip>${client}), lip=(?P<lip>${client})
Sieve_Disconnect = dovecot: (MANAGESIEVE|managesieve)\(%{USER}\): Disconnected: Logged out
Sieve_Close = dovecot: (MANAGESIEVE|managesieve)\(%{USER}\): Connection closed
Sieve_LDA = dovecot: lda\(%{USER}\): sieve: msgid=(?P<msgid>${msgid}): (?P<action>.+)
# Not found
Sieve_Script_Fail = dovecot: lda\(%{USER}\): sieve: execution of script\s(.+) failed
SSL_Rebuild = dovecot: ssl-build-param: SSL parameters regeneration completed
IMAP_Panic = dovecot: Panic: IMAP\(%{USER}\): (?P<reason>.+)
IMAP_Message = dovecot: IMAP\(%{USER}\): (?P<message>.+)
#POP3_Message = dovecot: POP3\(%{USER}\): (?P<message>.+)
Child_Kill = dovecot: child %{PID} \(imap\) killed with signal (?P<signal>\d+)
Indexer = dovecot: indexer-worker\(%{USER}\): Indexed (?P<num>\d+) messages in\s
Indexer_Error = dovecot: indexer-worker\(%{USER}\): (Panic|Error|Fatal): (?P<reason>.+)$
Indexer_Error2 = dovecot: indexer: Error: Indexer worker disconnected, discarding (?P<num>\d+)\srequests for %{USER}

##
# Report data
#
[user_logins]
subreport = login
title = User Logins
color = blue
function = table("Username","Service","Server::client")
IMAP_Login = (user!="\broot\b",user,"imap(dc)",host,client)
POP3_Login = (user!="\broot\b",user,"pop3(dc)",host,client)

[user_failures]
subreport = login
title = User Failures
color = red
function = table("Username","Service","Server::client")
IMAP_Login_Fail = (user!="\broot\b",user,"imap(dc)",host,client)
POP3_Login_Fail = (user!="\broot\b",user,"pop3(dc)",host,client)
