##
# "dovecot" app configuration for lograptor
#
[main]
description = Dovecot IMAP/POP daemon
tags = dovecot, deliver
files = ${logdir}/maillog*, ${logdir}/dovecot*, ${logdir}/${host}/%Y/%m/dovecot-%Y%m%d.log*
enabled = yes
priority = 2

##
# Matching rules for "dovecot" application
#
[rules]
IMAP_LOGIN = dovecot: imap-login: Login: user=<%{USER:user}>,\sPID=%{UNKNOWN:thread}
              ,\s(\S+),\srip=%{IPORHOST:client}
POP3_LOGIN = dovecot: pop3-login: Login: user=<%{USER:user}>,\sPID=%{UNKNOWN:thread}
              ,\s(\S+),\srip=%{IPORHOST:client}
# Not present in test logs
IMAP_AUTH_FAIL = dovecot: imap-login: Disconnected \(auth failed, \d+ attempts\): user=<%{MAIL:user}>
                 , PID=%{POSINT:pid}, method=PLAIN, rip=%{IPORHOST:rip}, lip=%{IPORHOST:lip}
# Not present in test logs
POP3_AUTH_FAIL = dovecot: pop3-login: Disconnected \(auth failed, \d+ attempts\): user=<%{MAIL:user}>
                 , PID=%{POSINT:pid}, method=PLAIN, rip=%{IPORHOST:rip}, lip=%{IPORHOST:lip}
# Not present in test logs
DELIVER_FORWARD = deliver\(%{USER:user}\): msgid=%{MSGID:msgid}
                  : forwarded to <%{MAIL:mail}(?:|\.\.\.)>
IMAP_LOGIN_FAIL = dovecot: imap-login: (Disconnected|Aborted login)\s
                  \(%{DATA:reason}\):( user=<%{USER:user}>,)? PID=%{UNKNOWN:thread}
                  (, method=%{DATA:method})?, rip=%{IPORHOST:client}, lip=%{IPORHOST:lip}
POP3_LOGIN_FAIL = dovecot: pop3-login: (Disconnected(|: Inactivity)|Aborted login)\s
                  \(%{DATA:reason}\):( user=<%{USER:user}>,)? PID=%{UNKNOWN:thread}
                  (, method=%{DATA:method})?, rip=%{IPORHOST:client}, lip=%{IPORHOST:lip}
IMAP_MAX_CONN = dovecot: imap-login: Maximum number of connections from user\+IP exceeded \(
                mail_max_userip_connections\): user=<%{USER:user}>, PID=%{POSINT:pid}
                , method=PLAIN, rip=%{IPORHOST:rip}, lip=%{IPORHOST:lip}, TLS
IMAP_DISCONNECT = dovecot: (IMAP|imap)\(%{USER:user}\): Disconnected%{DATA:reason}
IMAP_DISCONNECT2 = dovecot: imap-login: Disconnected%{DATA:reason}
# Not present in test logs
IMAP_ERROR = dovecot: imap\(%{USER:user}\): Error: %{DATA:reason}
POP3_DISCONNECT = dovecot: (POP3|pop3)\(%{USER:user}\): Disconnected%{DATA:reason}
IMAP_CLOSE = dovecot: (IMAP|imap)\(%{USER:user}\): Connection closed
POP3_CLOSE = dovecot: (POP3|pop3)\(%{USER:user}\): Connection closed
DELIVER_SAVE = deliver\(%{USER:user}\): msgid=%{MSGID:msgid}: saved mail to %{DATA:folder}
DELIVER_FORWARD2 = deliver\(%{USER:user}\): msgid=%{MSGID:msgid}: forwarded to <%{MAIL:mail}>
DELIVER_SAVE_FAIL = deliver\(%{USER:user}\): msgid=%{MSGID:msgid}: save failed to %{DATA:folder}
DELIVER_MKDIR_FAIL = deliver\(%{USER:user}\): mkdir\(%{DATA:folder}\) failed: Permission denied
DELIVER_SIEVE_ERROR = deliver\(%{USER:user}\): sieve runtime error: %{DATA:reason}
DELIVER_SIEVE_FAIL = deliver\(%{USER:user}\): sieve_execute_bytecode\(.+\) failed
DELIVER_DISCARD = deliver\(%{USER:user}\): msgid=%{MSGID:msgid}: discarded%{DATA:reason}
DELIVER_VACATION = deliver\(%{USER:user}\): msgid=%{MSGID:msgid}
                   : sent vacation response to <%{MAIL:mail}(?:|\.\.\.)>
SIEVE_LOGIN = dovecot: managesieve-login: Login: user=<%{MAIL:user}>, PID=%{POSINT:pid}, method=PLAIN
               , rip=%{IPORHOST:rip}, lip=%{IPORHOST:lip}
SIEVE_DISCONNECT = dovecot: (MANAGESIEVE|managesieve)\(%{USER:user}\): Disconnected: Logged out
SIEVE_CLOSE = dovecot: (MANAGESIEVE|managesieve)\(%{USER:user}\): Connection closed
SIEVE_LDA = dovecot: lda\(%{USER:user}\): sieve: msgid=%{MSGID:msgid}: %{DATA:action}
# Not found
SIEVE_SCRIPT_FAIL = dovecot: lda\(%{USER:user}\): sieve: execution of script\s(.+) failed
SSL_REBUILD = dovecot: ssl-build-param: SSL parameters regeneration completed
IMAP_PANIC = dovecot: Panic: IMAP\(%{USER:user}\): %{DATA:reason}
IMAP_MESSAGE = dovecot: IMAP\(%{USER:user}\): %{DATA:message}
# POP3_MESSAGE = dovecot: POP3\(%{USER:user}\): %{DATA:message}
CHILD_KILL = dovecot: child %{POSINT:pid} \(imap\) killed with signal %{POSINT:signal}
INDEXER = dovecot: indexer-worker\(%{USER:user}\): Indexed %{POSINT:num} messages in\s
INDEXER_ERROR = dovecot: indexer-worker\(%{USER:user}\): (Panic|Error|Fatal): %{DATA:reason}$
INDEXER_ERROR2 = dovecot: indexer: Error: Indexer worker disconnected, discarding %{POSINT:num}\s
                  requests for %{USER:user}

##
# Report data
#
[user_logins]
subreport = login
title = User Logins
color = blue
function = table("Username","Service","Server::client")
IMAP_LOGIN = (user!="\broot\b",user,"imap(dc)",host,client)
POP3_LOGIN = (user!="\broot\b",user,"pop3(dc)",host,client)

[user_failures]
subreport = login
title = User Failures
color = red
function = table("Username","Service","Server::client")
IMAP_LOGIN_FAIL = (user!="\broot\b",user,"imap(dc)",host,client)
POP3_LOGIN_FAIL = (user!="\broot\b",user,"pop3(dc)",host,client)
